name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Not used at runtime during `next build`; satisfies modules that read DATABASE_URL at import time.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      BETTER_AUTH_SECRET: ci-placeholder-secret-minimum-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
